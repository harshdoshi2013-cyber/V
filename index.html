<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Typing Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', sans-serif;
        color: #fff;
        overflow: hidden;
    }

    .container {
        text-align: center;
        animation: fadeIn 1.5s ease forwards;
    }

    h1 {
        font-size: 2.2rem;
        margin-bottom: 15px;
    }

    .typing {
        font-size: 1.4rem;
        border-right: 3px solid #fff;
        white-space: nowrap;
        overflow: hidden;
        width: 0;
        animation: typing 4s steps(40, end) forwards,
                   blink 0.8s infinite;
    }

    @keyframes typing {
        to { width: 100%; }
    }

    @keyframes blink {
        50% { border-color: transparent; }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(40px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>

<body>
<div class="container">
    <h1>Welcome 👋</h1>
    <div class="typing" id="typingText"></div>
</div>

<script>
    const text = "This page appears with typing animation ✨";
    let i = 0;
    const speed = 80;

    function typeWriter() {
        if (i < text.length) {
            document.getElementById("typingText").textContent += text.charAt(i);
            i++;
            setTimeout(typeWriter, speed);
        }
    }

    setTimeout(typeWriter, 800);
</script>
</body>
</html>
