<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💘 A Question For You</title>
<style>
  body {
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }
  .card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  h1 {
    color: #ff4d6d;
  }
  button {
    font-size: 18px;
    padding: 10px 20px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }
  #yes {
    background: #ff4d6d;
    color: white;
  }
  #no {
    background: #ccc;
    position: absolute;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Will you be my Valentine? 💖</h1>
  <button id="yes" onclick="yesClick()">Yes 💘</button>
  <button id="no" onmouseover="moveNo()">No 🙃</button>
</div>

<script>
function yesClick() {
  document.body.innerHTML = "<h1 style='color:white;'>YAY!!! 💕💍</h1><p style='color:white;font-size:24px;'>Best choice ever 😍</p>";
}

function moveNo() {
  const no = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  no.style.left = x + "px";
  no.style.top = y + "px";
}
</script>

</body>
</html>
