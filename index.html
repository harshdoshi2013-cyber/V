<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maitri 💕</title>

<style>
  body {
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    animation: pop 0.8s ease;
  }

  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 { color: #ff4d6d; }
  p { font-size: 18px; color: #555; }

  button {
    font-size: 18px;
    padding: 12px 24px;
    margin: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }

  #yes { background: #ff4d6d; color: white; }
  #no { background: #ccc; position: absolute; }

  .heart {
    position: fixed;
    font-size: 24px;
    animation: float 4s linear forwards;
  }

  @keyframes float {
    from { transform: translateY(100vh); opacity: 0; }
    to { transform: translateY(-10vh); opacity: 1; }
  }

  iframe {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>

<body>

<!-- DISCLAIMER -->
<div class="card" id="start">
  <h1>🔊 Heads up!</h1>
  <p>Please increase your volume<br>for a better experience 💖</p>
  <button onclick="start()">I’m ready 🎧</button>
</div>

<!-- AUDIO PLAYER -->
<iframe
  id="player"
  allow="autoplay; encrypted-media"
></iframe>

<script>
function start() {
  // Load & autoplay Perfect – Ed Sheeran
  document.getElementById("player").src =
    "https://www.youtube.com/embed/2Vv-BfVoq4g?autoplay=1&controls=0&loop=1&playlist=2Vv-BfVoq4g";

  document.body.innerHTML = `
    <div class="card">
      <h1>Maitri, will you be my Valentine? 💖</h1>
      <p>I have something special to ask you 😌</p>
      <button id="yes" onclick="yes()">Yes 💘</button>
      <button id="no" onmouseover="move()">No 🙃</button>
    </div>
  `;
}

function yes() {
  document.body.innerHTML = `
    <div class="card">
      <h1>YAY!!! 💍💖</h1>
      <p>Maitri, you just made my day 🥰</p>
      <p>Happy Valentine’s Day 💕</p>
    </div>
  `;
  hearts();
}

function move() {
  const b = document.getElementById("no");
  b.style.left = Math.random() * (window.innerWidth - 100) + "px";
  b.style.top = Math.random() * (window.innerHeight - 50) + "px";
}

function hearts() {
  for (let i = 0; i < 25; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💖";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = (Math.random() * 2 + 3) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 5000);
  }
}
</script>

</body>
</html>
