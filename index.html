<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Typing Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1a2a6c, #0f2027);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    color: #fff;
    overflow: hidden;
}

/* Floating particles */
.particle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    animation: float 10s linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to   { transform: translateY(-120vh); }
}

/* Main box */
.container {
    text-align: center;
    padding: 40px 30px;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    animation: zoomIn 1.4s ease forwards;
}

@keyframes zoomIn {
    from {
        opacity: 0;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

h1 {
    font-size: 2.4rem;
    margin-bottom: 20px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 5px #00f2fe; }
    to   { text-shadow: 0 0 20px #00f2fe; }
}

.typing {
    font-size: 1.4rem;
    white-space: nowrap;
    overflow: hidden;
    border-right: 3px solid #fff;
}

/* Button */
button {
    margin-top: 30px;
    padding: 14px 36px;
    font-size: 1rem;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    color: #000;
    background: linear-gradient(90deg, #00f2fe, #4facfe);
    transition: 0.4s;
    position: relative;
    overflow: hidden;
}

button:hover {
    transform: scale(1.08);
}

button::after {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    background: rgba(255,255,255,0.3);
    top: -50%;
    left: -50%;
    transform: rotate(45deg) translateX(-100%);
    transition: 0.6s;
}

button:hover::after {
    transform: rotate(45deg) translateX(100%);
}
</style>
</head>

<body>

<!-- Particles -->
<script>
for(let i=0;i<30;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=5+Math.random()*10+"s";
    p.style.opacity=Math.random();
    document.body.appendChild(p);
}
</script>

<div class="container">
    <h1>Welcome ✨</h1>
    <div class="typing" id="typing"></div>
    <button onclick="alert('Next action here 🚀')">Continue</button>
</div>

<script>
const text = "This page opens with smooth animations and typing effect...";
let i = 0;

function typeText() {
    if (i < text.length) {
        document.getElementById("typing").textContent += text.charAt(i);
        i++;
        setTimeout(typeText, 70);
    }
}

setTimeout(typeText, 800);
</script>

</body>
</html>
