<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maitri 💕</title>

<style>
  body {
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: white;
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
  }

  button {
    font-size: 18px;
    padding: 12px 24px;
    margin: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: #ff4d6d;
    color: white;
  }

  #no {
    background: #ccc;
    position: absolute;
  }

  audio {
    margin-top: 15px;
  }
</style>
</head>

<body>

<div class="card" id="start">
  <h1>🔊 Please increase your volume</h1>
  <p>Tap play once if needed 💖</p>

  <!-- VISIBLE AUDIO (THIS IS THE KEY) -->
  <audio id="music" src="perfect.mp3" controls></audio>

  <br>
  <button onclick="startExperience()">Continue 💘</button>
</div>

<script>
function startExperience() {
  document.body.innerHTML = `
    <div class="card">
      <h1>Maitri, will you be my Valentine? 💖</h1>
      <button onclick="yes()">Yes 💘</button>
      <button id="no" onmouseover="move()">No 🙃</button>
    </div>
  `;
}

function yes() {
  document.body.innerHTML = `
    <div class="card">
      <h1>YAY!!! 💍💖</h1>
      <p>Maitri, you just made my day 🥰</p>
    </div>
  `;
}

function move() {
  const b = document.getElementById("no");
  b.style.left = Math.random() * (window.innerWidth - 100) + "px";
  b.style.top = Math.random() * (window.innerHeight - 50) + "px";
}
</script>

</body>
</html>
