<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maitri 💕</title>

<style>
  body {
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    animation: pop 0.8s ease;
  }

  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: #ff4d6d;
  }

  p {
    font-size: 18px;
    color: #555;
  }

  button {
    font-size: 18px;
    padding: 12px 24px;
    margin: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s;
  }

  button:hover {
    transform: scale(1.1);
  }

  #yes {
    background: #ff4d6d;
    color: white;
  }

  #no {
    background: #ccc;
    position: absolute;
  }

  .heart {
    position: fixed;
    font-size: 24px;
    animation: float 4s linear forwards;
  }

  @keyframes float {
    from { transform: translateY(100vh); opacity: 0; }
    to { transform: translateY(-10vh); opacity: 1; }
  }
</style>
</head>

<body>

<!-- START / DISCLAIMER SCREEN -->
<div class="card" id="start">
  <h1>🔊 Heads up!</h1>
  <p>Please increase your volume<br>for a better experience 💖</p>
  <button onclick="startExperience()">I’m ready 🎧</button>
</div>

<!-- AUDIO -->
<audio id="music" src="perfect.mp3"></audio>

<script>
function startExperience() {
  // play music
  const audio = document.getElementById("music");
  audio.volume = 0.8;   // nice romantic level
  audio.play();

  // show valentine question
  document.body.innerHTML = `
    <div class="card">
      <h1>Maitri, will you be my Valentine? 💖</h1>
      <p>I have something special to ask you 😌</p>
      <button id="yes" onclick="yesClicked()">Yes 💘</button>
      <button id="no" onmouseover="moveNo()">No 🙃</button>
    </div>
  `;
}

function yesClicked() {
  document.body.innerHTML = `
    <div class="card">
      <h1>YAY!!! 💍💖</h1>
      <p>Maitri, you just made my day 🥰</p>
      <p>Happy Valentine’s Day 💕</p>
    </div>
  `;
  floatingHearts();
}

function moveNo() {
  const no = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  no.style.left = x + "px";
  no.style.top = y + "px";
}

function floatingHearts() {
  for (let i = 0; i < 30; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
  }
}
</script>

</body>
</html>
